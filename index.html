<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Kitchen · Kitchen Companion</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/inventory.css">
</head>
<body data-page="inventory" data-root=".">
  <main class="app">
    <header class="page-header">
      <h1>My Kitchen</h1>
      <button id="add-item-btn" class="btn btn-primary btn-small" type="button">+ Add Item</button>
    </header>

    <label for="inventory-search" class="visually-hidden">Search inventory</label>
    <input id="inventory-search" class="input" type="search" placeholder="Search items…">

    <div id="location-filters" class="chip-row" role="group" aria-label="Filter by storage location"></div>

    <ul id="inventory-list" class="card-list"></ul>
  </main>

  <nav id="bottom-nav"></nav>

  <script type="module" src="js/inventory.js"></script>
</body>
</html>
