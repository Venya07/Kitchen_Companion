<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen Companion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">
  <div class="stage">
    <div class="device-scaler" id="scaler">
      <div class="device" id="device">
        <div class="device-camera" aria-hidden="true"></div>
        <div class="screen" id="screen">
          <div class="statusbar" aria-label="Device status">
            <span class="statusbar-time" id="clock">9:41</span>
            <span class="statusbar-icons">
              <svg class="icon" aria-label="Signal: full" role="img"><use href="#i-signal"></use></svg>
              <svg class="icon" aria-label="Wi-Fi: connected" role="img"><use href="#i-wifi"></use></svg>
              <span class="statusbar-battery"><span>87%</span><svg class="icon icon-battery" aria-label="Battery 87 percent" role="img"><use href="#i-battery"></use></svg></span>
            </span>
          </div>
          <header class="appbar" id="appbar"></header>
          <main class="main" id="main">
            <div class="view" id="view"></div>
            <div class="fab-slot" id="fab-slot"></div>
            <div class="toast-layer" id="toast-layer" aria-live="polite"></div>
          </main>
          <div class="keyboard" id="keyboard" aria-hidden="true"><img id="kb-img" src="assets/keyboard.svg" alt="" draggable="false"></div>
          <nav class="bottomnav" id="nav" aria-label="Main"></nav>
          <div class="dialog-layer" id="dialog-layer"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/kitchen.js"></script>
  <script src="js/shopping.js"></script>
  <script src="js/recipes.js"></script>
  <script src="js/household.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
