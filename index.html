<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Kitchen · Kitchen Companion</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/inventory.css">
</head>
<body data-page="inventory" data-root=".">
  <main class="app">
    <header class="page-header">
      <h1>My Kitchen</h1>
      <button id="add-item-btn" class="btn btn-primary btn-small" type="button">+ Add Item</button>
    </header>

    <label for="inventory-search" class="visually-hidden">Search your kitchen</label>
    <input id="inventory-search" class="input" type="search" placeholder="Search your kitchen…">

    <section class="section" aria-labelledby="kitchen-heading">
      <h2 id="kitchen-heading">Your Kitchen</h2>
      <ul id="inventory-list" class="card inventory-list"></ul>
    </section>
  </main>

  <dialog id="edit-dialog" class="modal" aria-labelledby="edit-title">
    <form id="edit-form" novalidate>
      <h2 id="edit-title">Edit item</h2>
      <div class="form-field">
        <label for="edit-quantity">Quantity (<span id="edit-unit"></span>)</label>
        <input id="edit-quantity" class="input" type="number" min="0" step="any" inputmode="decimal">
      </div>
      <p id="edit-error" class="form-error" role="alert"></p>
      <div class="modal-actions">
        <button id="edit-cancel" class="btn btn-secondary" type="button">Cancel</button>
        <button class="btn btn-primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <nav id="bottom-nav"></nav>

  <script type="module" src="js/inventory.js"></script>
</body>
</html>
