<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recipes · Kitchen Companion</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/recipes.css">
</head>
<body data-page="recipes" data-root="..">
  <main class="app">
    <header class="page-header">
      <h1>Recipes</h1>
      <button id="add-recipe-btn" class="btn btn-primary btn-small" type="button">+ Add Recipe</button>
    </header>

    <label for="recipe-search" class="visually-hidden">Search recipes</label>
    <input id="recipe-search" class="input" type="search" placeholder="Search recipes…">

    <ul id="recipe-list" class="card-list recipe-list"></ul>
  </main>

  <dialog id="recipe-dialog" class="modal" aria-labelledby="recipe-dialog-title">
    <form id="recipe-form" novalidate>
      <h2 id="recipe-dialog-title">Add Recipe</h2>
      <div class="form-field">
        <label for="recipe-name">Name</label>
        <input id="recipe-name" class="input" type="text">
      </div>
      <div class="form-field">
        <label for="recipe-description">Description</label>
        <input id="recipe-description" class="input" type="text">
      </div>
      <div class="form-row">
        <div class="form-field">
          <label for="recipe-prep">Prep (min)</label>
          <input id="recipe-prep" class="input" type="number" min="0" value="0">
        </div>
        <div class="form-field">
          <label for="recipe-cook">Cook (min)</label>
          <input id="recipe-cook" class="input" type="number" min="0" value="0">
        </div>
        <div class="form-field">
          <label for="recipe-servings">Servings</label>
          <input id="recipe-servings" class="input" type="number" min="1" value="1">
        </div>
      </div>
      <div class="form-field">
        <label for="recipe-ingredients">Ingredients</label>
        <span id="ingredients-hint" class="text-muted">One per line: amount, unit, name (e.g. 200 g Flour)</span>
        <textarea id="recipe-ingredients" class="input" aria-describedby="ingredients-hint"></textarea>
      </div>
      <div class="form-field">
        <label for="recipe-instructions">Steps</label>
        <span id="instructions-hint" class="text-muted">One step per line</span>
        <textarea id="recipe-instructions" class="input" aria-describedby="instructions-hint"></textarea>
      </div>
      <p id="recipe-error" class="form-error" role="alert"></p>
      <div class="modal-actions">
        <button id="recipe-cancel" class="btn btn-secondary" type="button">Cancel</button>
        <button class="btn btn-primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <nav id="bottom-nav"></nav>

  <script type="module" src="../js/recipes.js"></script>
</body>
</html>
